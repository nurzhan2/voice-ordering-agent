#  Применить:  docker compose restart backend
#
#  tier у категории — роль в скрипте продаж:
#    1 — продавать первым (сеты, пицца, мангал, горячее, хинкал)
#    2 — допродавать (салаты, супы, азия, фастфуд, десерты)
#    3 — обязательные добавки (гарниры, соусы, напитки)
#
#  ВАЖНО про aliases: это варианты, как гость произносит блюдо вслух.
#  От них напрямую зависит, поймёт бот с первого раза или переспросит.
#  Проставлены по здравому смыслу — стоит дополнить по записям звонков.
# ============================================================

settings:
  name: Тарелка
  operator_name: Амина
  phone: ""
  city: Махачкала

  opens: "10:00"
  closes: "23:00"
  timezone: Europe/Moscow

  # На время отладки — принимать заказы круглосуточно.
  # ПЕРЕД БОЕВЫМ ЗАПУСКОМ поставить false.
  ignore_hours: true

  delivery_time: в течение часа

  # Уточнить у заказчика: на сайте минимальная сумма есть,
  # но конкретное значение не указано.
  min_order: 0

  # Куда присылать новые заказы. Пусто — уведомления выключены.
  manager_whatsapp: ""

  delivery_zone:
    - Махачкала
    - Каспийск
  zone_note: Доставляем по Махачкале и Каспийску.

